<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiszki — ukraiński</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:     #fafaf8;
    --text:   #111111;
    --muted:  #888888;
    --border: #e2e2e0;
    --hover:  #f5f5f3;
    --hl:     #ffef7a;
    --font:   'Inter', system-ui, -apple-system, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { cursor: pointer; font-family: var(--font); }

  /* HEADER */
  .header {
    display: flex; align-items: center; gap: 10px;
    height: 40px; padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
    flex-shrink: 0;
  }
  .header-back {
    color: var(--muted); text-decoration: none; font-size: 12px;
    display: flex; align-items: center; gap: 3px; flex-shrink: 0;
  }
  .header-back:hover { color: var(--text); }
  .header-back svg { width: 14px; height: 14px; }
  .header-title {
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; flex: 1;
  }
  .counter {
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 12px; color: var(--muted); letter-spacing: 0.05em;
  }

  /* TABS */
  .tabs {
    display: flex; gap: 0;
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .tab {
    background: none; border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 14px 11px;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
    margin-bottom: -1px;
    transition: color .12s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 700; }

  /* MAIN */
  main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }

  /* CARD */
  .card {
    width: 100%; max-width: 600px;
    border: 1.5px solid var(--border);
    background: white;
    padding: 36px 28px;
    cursor: pointer;
    min-height: 280px;
    display: flex; flex-direction: column; justify-content: center;
    transition: box-shadow .12s, transform .12s;
    user-select: none;
  }
  .card:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--text); }
  .card:active { transform: none; box-shadow: none; }

  .card-pl {
    font-size: 22px; line-height: 1.45;
    font-weight: 400; color: var(--text);
  }
  .card-hint {
    margin-top: 18px;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
  }
  .card-answer {
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px dashed var(--border);
  }
  .card-uk {
    font-size: 20px; line-height: 1.5; font-weight: 500;
  }
  .card-uk strong {
    font-weight: 600;
    background: var(--hl);
    padding: 1px 3px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .card-ph {
    margin-top: 8px;
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 13px; color: var(--muted); line-height: 1.4;
  }
  .card-ph::before { content: "[ "; }
  .card-ph::after  { content: " ]"; }
  .card-example {
    margin-top: 18px;
    border-left: 2px solid var(--border);
    padding: 4px 0 4px 14px;
    font-size: 15px; line-height: 1.5;
    font-style: italic; color: var(--text);
  }
  .card-note {
    margin-top: 12px;
    font-size: 13px; line-height: 1.5; color: var(--muted);
  }
  .card-note strong { color: var(--text); font-style: normal; }

  /* CONTROLS */
  .controls {
    display: flex; gap: 8px;
    padding: 0 16px 10px;
    max-width: 632px; margin: 0 auto; width: 100%;
  }
  .controls button {
    flex: 1; background: var(--bg); border: 1.5px solid var(--border);
    padding: 11px 8px;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text); font-weight: 500;
    transition: background .12s, box-shadow .12s;
  }
  .controls button:hover { background: var(--hover); box-shadow: 2px 2px 0 var(--border); }
  .controls button:active { box-shadow: none; }
  .btn-reveal { font-weight: 700; }

  .util {
    display: flex; gap: 8px;
    padding: 0 16px 20px;
    max-width: 632px; margin: 0 auto; width: 100%;
  }
  .util button {
    flex: 1; background: none; border: 1px solid var(--border);
    padding: 8px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted);
    transition: color .12s, border-color .12s;
  }
  .util button:hover { color: var(--text); border-color: var(--text); }

  .kb {
    text-align: center; padding: 0 0 16px;
    font-size: 10px; color: var(--muted); letter-spacing: 0.08em;
  }
  .kb kbd {
    background: white; border: 1px solid var(--border);
    padding: 2px 5px; font-family: monospace; font-size: 10px; margin: 0 2px;
  }

  /* KNOWLEDGE LEVEL */
  .know {
    display: flex; gap: 8px;
    padding: 0 16px 10px;
    max-width: 632px; margin: 0 auto; width: 100%;
  }
  .know button {
    flex: 1; background: var(--bg); border: 1.5px solid var(--border);
    padding: 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); font-weight: 500;
    transition: background .12s, color .12s;
  }
  .know button:hover { color: var(--text); }
  .know button.active { color: white; font-weight: 700; }
  .know button[data-level="know"].active { background: #2e7d32; border-color: #2e7d32; }
  .know button[data-level="mid"].active  { background: #b98500; border-color: #b98500; }
  .know button[data-level="no"].active   { background: #d0342c; border-color: #d0342c; }

  /* EMPTY POOL */
  .empty {
    width: 100%; max-width: 600px;
    border: 1.5px dashed var(--border); background: white;
    padding: 36px 28px; text-align: center;
  }
  .empty p { font-size: 15px; line-height: 1.5; margin-bottom: 18px; }
  .empty button {
    background: var(--bg); border: 1.5px solid var(--border);
    padding: 10px 14px; margin: 0 4px;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;
  }
  .empty button:hover { background: var(--hover); }

  /* HEADER LINK */
  .header-link {
    background: none; border: none;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); padding: 2px 0;
    border-bottom: 1px dotted var(--muted); flex-shrink: 0;
  }
  .header-link:hover { color: var(--text); border-bottom-color: var(--text); }

  /* LIST VIEW */
  .list-view {
    flex: 1; overflow-y: auto;
    padding: 16px; max-width: 760px; margin: 0 auto; width: 100%;
  }
  .list-section {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin: 18px 0 8px;
  }
  .list-row {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border); background: white;
    padding: 8px 10px; margin-bottom: 6px;
  }
  .list-txt { flex: 1; min-width: 0; }
  .list-front { font-size: 13px; line-height: 1.4; }
  .list-back { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .list-know { display: flex; gap: 4px; flex-shrink: 0; }
  .list-know button {
    border: 1px solid var(--border); background: var(--bg);
    font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 4px 7px; color: var(--muted);
  }
  .list-know button.active { color: white; font-weight: 700; }
  .list-know button[data-level="know"].active { background: #2e7d32; border-color: #2e7d32; }
  .list-know button[data-level="mid"].active  { background: #b98500; border-color: #b98500; }
  .list-know button[data-level="no"].active   { background: #d0342c; border-color: #d0342c; }

  @media (max-width: 560px) {
    .card { padding: 26px 18px; min-height: 240px; }
    .card-pl { font-size: 19px; }
    .card-uk { font-size: 17px; }
    .list-row { flex-direction: column; align-items: flex-start; gap: 6px; }
  }
</style>
</head>
<body>

<header class="header">
  <a class="header-back" href="../../index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
    MiniApps
  </a>
  <span class="header-title">Fiszki — ukraiński</span>
  <button class="header-link" id="listBtn">Wszystkie fiszki</button>
  <span class="counter" id="counter">01 / 00</span>
</header>

<nav class="tabs">
  <button class="tab active" id="tab-sent" data-deck="sentences">Zdania</button>
  <button class="tab" id="tab-idiom" data-deck="idioms">Idiomy / kolokacje</button>
</nav>

<main>
  <div class="card" id="card" tabindex="0" role="button" aria-label="Karta — kliknij, aby odkryć odpowiedź">
    <div class="card-pl" id="cardPl"></div>
    <div class="card-hint" id="cardHint">Kliknij lub naciśnij spację, aby odkryć</div>
    <div class="card-answer" id="cardAnswer" hidden>
      <div class="card-uk" id="cardUk"></div>
      <div class="card-ph" id="cardPh"></div>
      <div class="card-example" id="cardExample" hidden></div>
      <div class="card-note" id="cardNote" hidden></div>
    </div>
  </div>
  <div class="empty" id="emptyBox" style="display:none;">
    <p>Wszystkie fiszki w tej talii masz oznaczone jako "Znam". Nie ma czego powtarzać.</p>
    <button id="emptyResetBtn">Resetuj statusy</button>
    <button id="emptyAllBtn">Przeglądaj wszystkie</button>
  </div>
</main>

<section class="list-view" id="listView" style="display:none;"></section>

<div class="controls">
  <button id="prevBtn">◄ Poprz.</button>
  <button id="revealBtn" class="btn-reveal">Odkryj</button>
  <button id="nextBtn">Nast. ►</button>
</div>
<div class="know" id="knowRow">
  <button data-level="know">Znam</button>
  <button data-level="mid">Średnio znam</button>
  <button data-level="no">Nie znam</button>
</div>
<div class="util">
  <button id="shuffleBtn">Wymieszaj</button>
  <button id="resetBtn">Od początku</button>
</div>
<div class="kb"><kbd>Spacja</kbd> odkryj &nbsp;·&nbsp; <kbd>←</kbd> <kbd>→</kbd> nawigacja</div>

    { pl: "Ni w ząb (nic nie rozumieć).", uk: "<strong>Ні бум-бум</strong>.", ph: "Ni bum-bum.", example: "Я в цьому ні бум-бум.", note: "<strong>Kontekst —</strong> kompletnie nic nie kumać w temacie. Bardzo potoczne, uliczne." },
    { pl: "Być na tej samej stronie. (zgadzać się)", uk: "<strong>Бути на одній хвилі</strong>.", ph: "Buty na odnij chwyli.", example: "Добре, що ми з тобою на одній хвилі.", note: "<strong>Kontekst —</strong> 'być na jednej fali' — mieć wspólne rozumienie. Naturalne w rozmowie i pracy." },
    { pl: "Wziąć się w garść.", uk: "<strong>Взяти себе в руки</strong>.", ph: "Wziaty sebe w ruky.", example: "Візьми себе в руки, ще не все втрачено.", note: "<strong>Kontekst —</strong> 'wziąć się w ręce' — opanować się, zebrać w sobie. Blisko polskiego." },
    { pl: "Zaciskać pasa. (oszczędzać)", uk: "<strong>Затягувати паски</strong>.", ph: "Zatiahuwaty pasky.", example: "Цього року доводиться затягувати паски.", note: "<strong>Kontekst —</strong> prawie dosłownie jak po polsku. Ograniczać wydatki w trudnym czasie." },
    { pl: "Palić się grunt pod nogami.", uk: "<strong>Земля горить під ногами</strong>.", ph: "Zemla horyt pid nohamy.", example: "Тут земля горить під ногами, треба відходити.", note: "<strong>Kontekst —</strong> 'ziemia pali się pod nogami' — sytuacja krytyczna, trzeba działać/uciekać. Częste w kontekście frontowym." }
  ]
};

// Poziomy znajomosci: 'know' | 'mid' | 'no' (brak wpisu = 'no').
// Persist w localStorage pod KNOW_KEY, indeksowane stabilnym hashem tresci fiszki
// (djb2 po pl+uk bez tagow HTML), wiec dopisywanie nowych fiszek nie psuje stanu.
const KNOW_KEY = 'fiszki-ua-knowledge';
const DECK_NAMES = { sentences: 'Zdania', idioms: 'Idiomy / kolokacje' };

function hashCard(c) {
  const s = (c.pl + '|' + (c.uk || '')).replace(/<[^>]*>/g, '');
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = (((h << 5) + h) + s.charCodeAt(i)) >>> 0;
  return 'c' + h.toString(36);
}
function loadKnow() { try { return JSON.parse(localStorage.getItem(KNOW_KEY)) || {}; } catch (e) { return {}; } }
let knowMap = loadKnow();
function saveKnow() { try { localStorage.setItem(KNOW_KEY, JSON.stringify(knowMap)); } catch (e) {} }
function statusOf(c) { return knowMap[hashCard(c)] || 'no'; }
function setStatus(c, lvl) { knowMap[hashCard(c)] = lvl; saveKnow(); }

let deck = 'sentences';
let showAll = false;
let listMode = false;
let pool = [];
let idx = 0;
let revealed = false;

const el = {
  counter: document.getElementById('counter'),
  card: document.getElementById('card'),
  pl: document.getElementById('cardPl'),
  hint: document.getElementById('cardHint'),
  answer: document.getElementById('cardAnswer'),
  uk: document.getElementById('cardUk'),
  ph: document.getElementById('cardPh'),
  example: document.getElementById('cardExample'),
  note: document.getElementById('cardNote'),
  revealBtn: document.getElementById('revealBtn'),
  emptyBox: document.getElementById('emptyBox'),
  emptyResetBtn: document.getElementById('emptyResetBtn'),
  emptyAllBtn: document.getElementById('emptyAllBtn'),
  knowRow: document.getElementById('knowRow'),
  knowBtns: document.querySelectorAll('#knowRow button'),
  listBtn: document.getElementById('listBtn'),
  listView: document.getElementById('listView'),
  mainEl: document.querySelector('main'),
  controlsEl: document.querySelector('.controls'),
  utilEl: document.querySelector('.util'),
  kbEl: document.querySelector('.kb'),
  tabsEl: document.querySelector('.tabs'),
  tabs: document.querySelectorAll('.tab')
};

function pad(n) { return String(n).padStart(2, '0'); }

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function poolFor(name) {
  const all = DATA[name];
  return showAll ? [...all] : all.filter(c => statusOf(c) !== 'know');
}

function buildPool() { pool = shuffleArr(poolFor(deck)); idx = 0; }

function updateKnowButtons() {
  const st = pool.length ? statusOf(pool[idx]) : null;
  el.knowBtns.forEach(b => b.classList.toggle('active', b.dataset.level === st));
}

function render() {
  if (!pool.length) {
    el.card.style.display = 'none';
    el.emptyBox.style.display = 'block';
    el.knowRow.style.visibility = 'hidden';
    el.counter.textContent = '00 / 00';
    return;
  }
  el.card.style.display = '';
  el.emptyBox.style.display = 'none';
  el.knowRow.style.visibility = '';
  const item = pool[idx];
  el.pl.textContent = item.pl;
  el.uk.innerHTML = item.uk;
  el.ph.textContent = item.ph || '';
  el.ph.hidden = !item.ph;
  if (deck === 'idioms' && item.example) {
    el.example.textContent = '\u201E' + item.example + '\u201D';
    el.example.hidden = false;
  } else { el.example.hidden = true; }
  if (deck === 'idioms' && item.note) {
    el.note.innerHTML = item.note;
    el.note.hidden = false;
  } else { el.note.hidden = true; }
  el.counter.textContent = pad(idx + 1) + ' / ' + pad(pool.length);
  setRevealed(false);
  updateKnowButtons();
}

function setRevealed(state) {
  revealed = state;
  el.answer.hidden = !state;
  el.hint.hidden = state;
  el.revealBtn.textContent = state ? 'Ukryj' : 'Odkryj';
}
function toggleReveal() { if (pool.length) setRevealed(!revealed); }
function go(delta) { if (!pool.length) return; idx = (idx + delta + pool.length) % pool.length; render(); }
function shuffle() { if (!pool.length) return; shuffleArr(pool); idx = 0; render(); }
function resetOrder() { showAll = false; buildPool(); render(); }
function switchDeck(name) {
  deck = name; showAll = false;
  el.tabs.forEach(t => t.classList.toggle('active', t.dataset.deck === name));
  buildPool(); render();
}

function renderList() {
  el.listView.innerHTML = '';
  Object.keys(DATA).forEach(dk => {
    const h = document.createElement('div');
    h.className = 'list-section';
    h.textContent = DECK_NAMES[dk] + ' (' + DATA[dk].length + ')';
    el.listView.appendChild(h);
    DATA[dk].forEach(c => {
      const row = document.createElement('div'); row.className = 'list-row';
      const txt = document.createElement('div'); txt.className = 'list-txt';
      const f = document.createElement('div'); f.className = 'list-front'; f.textContent = c.pl;
      const b = document.createElement('div'); b.className = 'list-back';
      b.textContent = (c.uk || '').replace(/<[^>]*>/g, '') + (c.ph ? ' [' + c.ph + ']' : '');
      txt.appendChild(f); txt.appendChild(b);
      const kn = document.createElement('div'); kn.className = 'list-know';
      [['know', 'Znam'], ['mid', 'Średnio'], ['no', 'Nie znam']].forEach(([lvl, label]) => {
        const btn = document.createElement('button');
        btn.dataset.level = lvl; btn.textContent = label;
        btn.classList.toggle('active', statusOf(c) === lvl);
        btn.addEventListener('click', () => {
          setStatus(c, lvl);
          kn.querySelectorAll('button').forEach(x => x.classList.toggle('active', x.dataset.level === lvl));
        });
        kn.appendChild(btn);
      });
      row.appendChild(txt); row.appendChild(kn);
      el.listView.appendChild(row);
    });
  });
}

function setListMode(on) {
  listMode = on;
  el.mainEl.style.display = on ? 'none' : '';
  el.controlsEl.style.display = on ? 'none' : '';
  el.knowRow.style.display = on ? 'none' : '';
  el.utilEl.style.display = on ? 'none' : '';
  el.kbEl.style.display = on ? 'none' : '';
  el.tabsEl.style.display = on ? 'none' : '';
  el.listView.style.display = on ? 'block' : 'none';
  el.listBtn.textContent = on ? 'Wróć do nauki' : 'Wszystkie fiszki';
  if (on) { renderList(); }
  else { buildPool(); render(); }
}

el.card.addEventListener('click', toggleReveal);
el.revealBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleReveal(); });
document.getElementById('prevBtn').addEventListener('click', () => go(-1));
document.getElementById('nextBtn').addEventListener('click', () => go(1));
document.getElementById('shuffleBtn').addEventListener('click', shuffle);
document.getElementById('resetBtn').addEventListener('click', resetOrder);
el.tabs.forEach(t => t.addEventListener('click', () => switchDeck(t.dataset.deck)));
el.knowBtns.forEach(b => b.addEventListener('click', () => {
  if (!pool.length) return;
  setStatus(pool[idx], b.dataset.level);
  updateKnowButtons();
}));
el.emptyResetBtn.addEventListener('click', () => {
  DATA[deck].forEach(c => { delete knowMap[hashCard(c)]; });
  saveKnow(); showAll = false; buildPool(); render();
});
el.emptyAllBtn.addEventListener('click', () => { showAll = true; buildPool(); render(); });
el.listBtn.addEventListener('click', () => setListMode(!listMode));
document.addEventListener('keydown', (e) => {
  if (listMode) return;
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); go(-1); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); go(1); }
});
el.card.addEventListener('keydown', (e) => { if (e.code === 'Enter') { e.preventDefault(); toggleReveal(); } });

buildPool();
render();
</script>
</body>
</html>
