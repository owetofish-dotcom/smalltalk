<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiszki — angielski</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:     #fafaf8;
    --text:   #111111;
    --muted:  #888888;
    --border: #e2e2e0;
    --hover:  #f5f5f3;
    --hl:     #ffef7a;
    --font:   'Inter', system-ui, -apple-system, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: var(--font);
    display: flex; flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { cursor: pointer; font-family: var(--font); }

  /* HEADER */
  .header {
    display: flex; align-items: center; gap: 10px;
    height: 40px; padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
    flex-shrink: 0;
  }
  .header-back {
    color: var(--muted); text-decoration: none; font-size: 12px;
    display: flex; align-items: center; gap: 3px; flex-shrink: 0;
  }
  .header-back:hover { color: var(--text); }
  .header-back svg { width: 14px; height: 14px; }
  .header-title {
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; flex: 1;
  }
  .counter {
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 12px; color: var(--muted); letter-spacing: 0.05em;
  }

  /* TABS */
  .tabs {
    display: flex; gap: 0;
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .tab {
    background: none; border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 14px 11px;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: -1px;
    transition: color .12s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 700; }

  /* MAIN */
  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }

  /* CARD */
  .card {
    width: 100%; max-width: 600px;
    border: 1.5px solid var(--border);
    background: white;
    padding: 36px 28px;
    cursor: pointer;
    min-height: 280px;
    display: flex; flex-direction: column; justify-content: center;
    transition: box-shadow .12s, transform .12s;
    user-select: none;
    position: relative;
  }
  .card:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--text); }
  .card:active { transform: none; box-shadow: none; }

  .card-hint {
    position: absolute; top: 16px; right: 20px;
    font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--muted);
  }

  .card-pl {
    font-size: 22px; line-height: 1.45;
    font-style: italic; color: var(--text);
    text-align: center;
  }

  .en-wrap { display: none; text-align: center; }
  .en-wrap.visible { display: block; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  .card-pl.hidden { display: none; }

  .en {
    font-size: 20px; line-height: 1.45; font-weight: 400; margin-bottom: 16px;
  }
  .en strong {
    background: var(--hl); padding: 1px 4px; font-weight: 400;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }

  .example {
    font-size: 15px; line-height: 1.5; font-style: italic;
    max-width: 480px; margin: 0 auto;
    padding: 14px 18px;
    border-left: 2px solid var(--border);
    text-align: left; background: var(--bg);
  }
  .example::before { content: "\201E"; font-size: 20px; line-height: 0; vertical-align: -6px; color: var(--muted); margin-right: 2px; }
  .example::after  { content: "\201D"; font-size: 20px; line-height: 0; vertical-align: -6px; color: var(--muted); margin-left: 2px; }

  .note {
    font-size: 13px; color: var(--muted); line-height: 1.5;
    max-width: 440px; margin: 14px auto 0;
    padding-top: 12px; border-top: 1px solid var(--border);
    font-style: italic;
  }

  /* CONTROLS */
  .controls {
    display: flex; gap: 8px;
    padding: 0 16px 10px;
    max-width: 632px; margin: 0 auto; width: 100%;
  }
  .controls button {
    flex: 1; background: var(--bg); border: 1.5px solid var(--border);
    padding: 11px 8px;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text); font-weight: 500;
    transition: background .12s, box-shadow .12s;
  }
  .controls button:hover { background: var(--hover); box-shadow: 2px 2px 0 var(--border); }
  .controls button:active { box-shadow: none; }
  .controls button:disabled { opacity: 0.3; cursor: not-allowed; }
  .controls button:disabled:hover { background: var(--bg); box-shadow: none; }
  .btn-primary { background: var(--text) !important; color: white !important; font-weight: 700; }
  .btn-primary:hover { background: var(--hover) !important; color: var(--text) !important; }

  .util {
    display: flex; gap: 8px;
    padding: 0 16px 20px;
    max-width: 632px; margin: 0 auto; width: 100%;
    justify-content: center;
  }
  .util button {
    background: none; border: none;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); padding: 4px 0;
    border-bottom: 1px dotted var(--muted);
  }
  .util button:hover { color: var(--text); border-bottom-style: solid; border-bottom-color: var(--text); }

  .kb {
    text-align: center; padding: 0 0 16px;
    font-size: 10px; color: var(--muted); letter-spacing: 0.08em;
  }
  .kb kbd {
    background: white; border: 1px solid var(--border);
    padding: 2px 5px; font-family: monospace; font-size: 10px; margin: 0 2px;
  }

  /* KNOWLEDGE LEVEL */
  .know {
    display: flex; gap: 8px;
    padding: 0 16px 10px;
    max-width: 632px; margin: 0 auto; width: 100%;
  }
  .know button {
    flex: 1; background: var(--bg); border: 1.5px solid var(--border);
    padding: 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); font-weight: 500;
    transition: background .12s, color .12s;
  }
  .know button:hover { color: var(--text); }
  .know button.active { color: white; font-weight: 700; }
  .know button[data-level="know"].active { background: #2e7d32; border-color: #2e7d32; }
  .know button[data-level="mid"].active  { background: #b98500; border-color: #b98500; }
  .know button[data-level="no"].active   { background: #d0342c; border-color: #d0342c; }

  /* EMPTY POOL */
  .empty {
    width: 100%; max-width: 600px;
    border: 1.5px dashed var(--border); background: white;
    padding: 36px 28px; text-align: center;
  }
  .empty p { font-size: 15px; line-height: 1.5; margin-bottom: 18px; }
  .empty button {
    background: var(--bg); border: 1.5px solid var(--border);
    padding: 10px 14px; margin: 0 4px;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;
  }
  .empty button:hover { background: var(--hover); }

  /* HEADER LINK */
  .header-link {
    background: none; border: none;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); padding: 2px 0;
    border-bottom: 1px dotted var(--muted); flex-shrink: 0;
  }
  .header-link:hover { color: var(--text); border-bottom-color: var(--text); }

  /* LIST VIEW */
  .list-view {
    flex: 1; overflow-y: auto;
    padding: 16px; max-width: 760px; margin: 0 auto; width: 100%;
  }
  .list-section {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin: 18px 0 8px;
  }
  .list-row {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border); background: white;
    padding: 8px 10px; margin-bottom: 6px;
  }
  .list-txt { flex: 1; min-width: 0; }
  .list-front { font-size: 13px; line-height: 1.4; }
  .list-back { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .list-know { display: flex; gap: 4px; flex-shrink: 0; }
  .list-know button {
    border: 1px solid var(--border); background: var(--bg);
    font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 4px 7px; color: var(--muted);
  }
  .list-know button.active { color: white; font-weight: 700; }
  .list-know button[data-level="know"].active { background: #2e7d32; border-color: #2e7d32; }
  .list-know button[data-level="mid"].active  { background: #b98500; border-color: #b98500; }
  .list-know button[data-level="no"].active   { background: #d0342c; border-color: #d0342c; }

  @media (max-width: 560px) {
    .card { padding: 26px 18px; min-height: 240px; }
    .card-pl { font-size: 19px; }
    .en { font-size: 17px; }
    .list-row { flex-direction: column; align-items: flex-start; gap: 6px; }
  }
</style>
</head>

    { pl: "natknąć się przypadkiem", en: "<strong>come across</strong>", example: "I just <strong>came across</strong> your article on LinkedIn — really impressive.", note: "Alternatywa: \"stumble upon\" — bardziej podkreśla przypadkowość." },
    { pl: "dotrzeć (do miejsca / eventu)", en: "<strong>make it to</strong>", example: "I've just <strong>made it to</strong> the airport, will call once I'm through security.", note: "Częstsze i cieplejsze niż formalne \"arrive at\". Sugeruje trud lub wysiłek." },
    { pl: "wchodzić w życie / zaczynać działać", en: "<strong>kick in</strong>", example: "The real learning <strong>kicks in</strong> when you start applying the theory.", note: "O procesach, efektach, lekach, emocjach — wszystko, co się \"włącza\" po czasie." },
    { pl: "pozwolić sobie na (uprzejmie)", en: "<strong>take the liberty of</strong>", example: "I <strong>took the liberty of</strong> preparing a draft based on my previous experience.", note: "Dyplomatyczna formuła na uprzejmą inicjatywę. Pisownia formalna, ale często używana." },
    { pl: "przydać się", en: "<strong>come in handy</strong>", example: "This travel policy template might <strong>come in handy</strong> for the team.", note: "\"Handy\" = poręczny, użyteczny. Ciepły, pozytywny ton." },
    { pl: "Twoja decyzja / masz głos", en: "<strong>it's your call</strong>", example: "I've laid out the options — <strong>it's your call</strong> from here.", note: "Amerykański skrót na przekazanie odpowiedzialności. Brzmi z szacunkiem, nie z rezygnacją." },
    { pl: "zawracać komuś głowę", en: "<strong>bug someone</strong>", example: "Sorry to <strong>bug you</strong> again, but I have one more quick question.", note: "Lekkie, samokrytyczne. Amerykańskie — Brytyjczycy powiedzą \"bother\"." },
    { pl: "dokładnie / w punkt", en: "<strong>spot on</strong>", example: "Your analysis is <strong>spot on</strong> — that's exactly what I was thinking.", note: "Krótkie i konkretne potwierdzenie trafności czyjejś obserwacji." },
    { pl: "oko do X (talent, wyczucie)", en: "<strong>an eye for X</strong>", example: "She has <strong>an eye for</strong> detail that makes her designs stand out.", note: "\"An eye for aesthetics/detail/design/talent\" — talent wzrokowo-oceniający." },
    { pl: "czapki z głów / szacunek", en: "<strong>hats off</strong>", example: "<strong>Hats off</strong> to the team for pulling this off in two weeks.", note: "Brytyjsko-amerykańska pochwała, formalna ale ciepła. Często w LinkedIn komentarzach." },
    { pl: "wdrożone / działające", en: "<strong>in place</strong>", example: "Once the new process is <strong>in place</strong>, onboarding will be much smoother.", note: "Korpo idiom o systemach, procesach, procedurach — \"in place\" = ustawione i działa." }
  ]
};

// Poziomy znajomosci: 'know' | 'mid' | 'no' (brak wpisu = 'no').
// Persist w localStorage pod KNOW_KEY, indeksowane stabilnym hashem tresci fiszki
// (djb2 po pl+en bez tagow HTML), wiec dopisywanie nowych fiszek nie psuje stanu.
const KNOW_KEY = 'fiszki-en-knowledge';
const DECK_NAMES = { sentences: 'Zdania', idioms: 'Idiomy' };

function hashCard(c) {
  const s = (c.pl + '|' + (c.en || '')).replace(/<[^>]*>/g, '');
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = (((h << 5) + h) + s.charCodeAt(i)) >>> 0;
  return 'c' + h.toString(36);
}
function loadKnow() { try { return JSON.parse(localStorage.getItem(KNOW_KEY)) || {}; } catch (e) { return {}; } }
let knowMap = loadKnow();
function saveKnow() { try { localStorage.setItem(KNOW_KEY, JSON.stringify(knowMap)); } catch (e) {} }
function statusOf(c) { return knowMap[hashCard(c)] || 'no'; }
function setStatus(c, lvl) { knowMap[hashCard(c)] = lvl; saveKnow(); }

let currentDeck = 'sentences';
let showAll = false;
let listMode = false;
let cards = [];
let index = 0;
let flipped = false;

const els = {
  card: document.getElementById('card'),
  cardHint: document.getElementById('cardHint'),
  plText: document.getElementById('plText'),
  enWrap: document.getElementById('enWrap'),
  enText: document.getElementById('enText'),
  exampleText: document.getElementById('exampleText'),
  noteText: document.getElementById('noteText'),
  counter: document.getElementById('counter'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  flipBtn: document.getElementById('flipBtn'),
  shuffleBtn: document.getElementById('shuffleBtn'),
  resetBtn: document.getElementById('resetBtn'),
  emptyBox: document.getElementById('emptyBox'),
  emptyResetBtn: document.getElementById('emptyResetBtn'),
  emptyAllBtn: document.getElementById('emptyAllBtn'),
  knowRow: document.getElementById('knowRow'),
  knowBtns: document.querySelectorAll('#knowRow button'),
  listBtn: document.getElementById('listBtn'),
  listView: document.getElementById('listView'),
  mainEl: document.querySelector('main'),
  controlsEl: document.querySelector('.controls'),
  utilEl: document.querySelector('.util'),
  kbEl: document.querySelector('.kb'),
  tabsEl: document.querySelector('.tabs'),
  tabs: document.querySelectorAll('.tab')
};

function pad(n) { return String(n).padStart(2, '0'); }

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function poolFor(deck) {
  const all = decks[deck];
  return showAll ? [...all] : all.filter(c => statusOf(c) !== 'know');
}

function buildCards() { cards = shuffleArr(poolFor(currentDeck)); index = 0; }

function updateKnowButtons() {
  const st = cards.length ? statusOf(cards[index]) : null;
  els.knowBtns.forEach(b => b.classList.toggle('active', b.dataset.level === st));
}

function render() {
  if (!cards.length) {
    els.card.style.display = 'none';
    els.emptyBox.style.display = 'block';
    els.knowRow.style.visibility = 'hidden';
    els.counter.textContent = '00 / 00';
    els.prevBtn.disabled = true; els.nextBtn.disabled = true; els.flipBtn.disabled = true;
    return;
  }
  els.card.style.display = '';
  els.emptyBox.style.display = 'none';
  els.knowRow.style.visibility = '';
  els.flipBtn.disabled = false;
  const c = cards[index];
  els.plText.textContent = c.pl;
  els.enText.innerHTML = c.en;
  if (c.example) { els.exampleText.innerHTML = c.example; els.exampleText.style.display = 'block'; }
  else { els.exampleText.style.display = 'none'; }
  if (c.note) { els.noteText.textContent = c.note; els.noteText.style.display = 'block'; }
  else { els.noteText.style.display = 'none'; }
  els.counter.textContent = pad(index + 1) + ' / ' + pad(cards.length);
  els.prevBtn.disabled = index === 0;
  els.nextBtn.disabled = index === cards.length - 1;
  setFlipped(false);
  updateKnowButtons();
}

function setFlipped(state) {
  flipped = state;
  if (state) {
    els.plText.classList.add('hidden');
    els.enWrap.classList.add('visible');
    els.cardHint.textContent = 'Kliknij, aby ukryć';
    els.flipBtn.textContent = 'Ukryj';
  } else {
    els.plText.classList.remove('hidden');
    els.enWrap.classList.remove('visible');
    els.cardHint.textContent = 'Kliknij, aby odkryć';
    els.flipBtn.textContent = 'Odkryj';
  }
}

function next() { if (index < cards.length - 1) { index++; render(); } }
function prev() { if (index > 0) { index--; render(); } }
function flip() { if (cards.length) setFlipped(!flipped); }

function shuffle() { if (!cards.length) return; shuffleArr(cards); index = 0; render(); }
function reset() { showAll = false; buildCards(); render(); }

function switchDeck(deck) {
  currentDeck = deck; showAll = false;
  els.tabs.forEach(t => t.classList.toggle('active', t.dataset.deck === deck));
  buildCards(); render();
}

function renderList() {
  els.listView.innerHTML = '';
  Object.keys(decks).forEach(dk => {
    const h = document.createElement('div');
    h.className = 'list-section';
    h.textContent = DECK_NAMES[dk] + ' (' + decks[dk].length + ')';
    els.listView.appendChild(h);
    decks[dk].forEach(c => {
      const row = document.createElement('div'); row.className = 'list-row';
      const txt = document.createElement('div'); txt.className = 'list-txt';
      const f = document.createElement('div'); f.className = 'list-front'; f.textContent = c.pl;
      const b = document.createElement('div'); b.className = 'list-back'; b.textContent = (c.en || '').replace(/<[^>]*>/g, '');
      txt.appendChild(f); txt.appendChild(b);
      const kn = document.createElement('div'); kn.className = 'list-know';
      [['know', 'Znam'], ['mid', 'Średnio'], ['no', 'Nie znam']].forEach(([lvl, label]) => {
        const btn = document.createElement('button');
        btn.dataset.level = lvl; btn.textContent = label;
        btn.classList.toggle('active', statusOf(c) === lvl);
        btn.addEventListener('click', () => {
          setStatus(c, lvl);
          kn.querySelectorAll('button').forEach(x => x.classList.toggle('active', x.dataset.level === lvl));
        });
        kn.appendChild(btn);
      });
      row.appendChild(txt); row.appendChild(kn);
      els.listView.appendChild(row);
    });
  });
}

function setListMode(on) {
  listMode = on;
  els.mainEl.style.display = on ? 'none' : '';
  els.controlsEl.style.display = on ? 'none' : '';
  els.knowRow.style.display = on ? 'none' : '';
  els.utilEl.style.display = on ? 'none' : '';
  els.kbEl.style.display = on ? 'none' : '';
  els.tabsEl.style.display = on ? 'none' : '';
  els.listView.style.display = on ? 'block' : 'none';
  els.listBtn.textContent = on ? 'Wróć do nauki' : 'Wszystkie fiszki';
  if (on) { renderList(); }
  else { buildCards(); render(); }
}

els.card.addEventListener('click', flip);
els.flipBtn.addEventListener('click', (e) => { e.stopPropagation(); flip(); });
els.prevBtn.addEventListener('click', prev);
els.nextBtn.addEventListener('click', next);
els.shuffleBtn.addEventListener('click', shuffle);
els.resetBtn.addEventListener('click', reset);
els.tabs.forEach(t => t.addEventListener('click', () => switchDeck(t.dataset.deck)));
els.knowBtns.forEach(b => b.addEventListener('click', () => {
  if (!cards.length) return;
  setStatus(cards[index], b.dataset.level);
  updateKnowButtons();
}));
els.emptyResetBtn.addEventListener('click', () => {
  decks[currentDeck].forEach(c => { delete knowMap[hashCard(c)]; });
  saveKnow(); showAll = false; buildCards(); render();
});
els.emptyAllBtn.addEventListener('click', () => { showAll = true; buildCards(); render(); });
els.listBtn.addEventListener('click', () => setListMode(!listMode));
document.addEventListener('keydown', (e) => {
  if (listMode) return;
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.code === 'ArrowRight') next();
  else if (e.code === 'ArrowLeft') prev();
});

buildCards();
render();
</script>
</body>
</html>
