<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Morning Brief</title><style>
:root{
  --bg:#fafaf8; --panel:#ffffff; --line:#e2e2e0;
  --txt:#111111; --dim:#888888; --acc:#111111;
  --warn:#b45309; --ok:#15803d; --red:#c62828; --blue:#1e5b94;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.topbar{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:8px}
.topbar a.back{color:var(--dim);text-decoration:none;font-size:13px}
.topbar a.back:hover{color:var(--txt)}
.topbar h1{margin:0;font-size:20px;letter-spacing:-.3px;flex:1}
.topbar .stamp{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
#content{min-height:120px}
.msg{color:var(--dim);padding:24px 0}
.msg a{color:var(--txt)}

/* ===== Light restyle of injected brief content =====
   Brief.html styles are NOT injected; everything below
   styles the brief markup with the SmallTalk light palette. */
#content{margin:0;padding:0}
#content .wrap{max-width:100%;padding:8px 0 0;margin:0}
#content body{background:transparent}

/* Header of the brief */
#content header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}
#content .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--warn);font-weight:700}
#content h1{margin:6px 0 4px;font-size:26px;letter-spacing:-.5px;color:var(--txt);font-weight:800}
#content .sub{color:var(--dim);font-size:13px;margin-top:4px;text-transform:none;letter-spacing:0}

/* Headings */
#content h2{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#content h2 .n{background:#f1f1ef;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--dim);font-size:11px;letter-spacing:0;text-transform:none;font-weight:600}
#content h3{font-size:15px;font-weight:700;margin:16px 0 8px;color:var(--txt)}
#content h4{font-size:13px;font-weight:700;margin:14px 0 6px;color:#444}

/* Cards: brief uses <section>, legacy briefs used .card */
#content section,#content .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
#content section.att,#content .card.alert{border-left:3px solid var(--warn);background:#fdfbf5}
#content .card.hot{border-left:3px solid var(--red)}
#content .card.good{border-left:3px solid var(--ok)}

/* Rows */
#content .row{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);border-bottom:0}
#content .row:first-of-type{border-top:0}
#content .t{font-weight:600;color:var(--txt);font-size:14px;min-width:0;font-variant-numeric:tabular-nums}
#content .d{color:var(--dim);font-size:13px;margin-top:2px}
#content .who{color:#444;font-weight:600;font-size:13px}
#content .what{flex:1}
#content .muted{color:var(--dim);font-size:13px}
#content .k{font-weight:700}

/* Tags */
#content .tag{flex:0 0 auto;display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--dim);background:#f6f6f4;margin-top:3px;white-space:nowrap}
#content .tag.hot,#content .tag.due{border-color:#efc4c4;color:var(--red);background:#fdf3f3;font-weight:600}
#content .tag.ok,#content .tag.good{border-color:#bfe0c6;color:var(--ok);background:#f2faf4}
#content .tag.blue,#content .tag.work{border-color:#bcd4ea;color:var(--blue);background:#f2f7fc}
#content .tag.other{border-color:#e4d6bd;color:#8a6a33;background:#faf6ee}

/* Sections helpers */
#content .grid,#content .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#content .mail-h{font-size:12px;color:var(--blue);font-weight:700;margin-bottom:6px;font-family:var(--mono)}
#content .news .t{font-size:15px}
#content .news .d{margin-top:2px}
#content .note{background:#f8f5ec;border-left:3px solid var(--warn);padding:12px 14px;border-radius:0 8px 8px 0;font-size:13px;color:#555;margin-top:14px}

/* Generic elements the brief may emit */
#content ul,#content ol{margin:6px 0;padding-left:20px}
#content li{margin:5px 0}
#content table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;background:var(--panel)}
#content th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);border-bottom:2px solid var(--line);padding:7px 10px;background:#f6f6f4}
#content td{border-bottom:1px solid var(--line);padding:7px 10px;vertical-align:top}
#content tbody tr:nth-child(even) td{background:#f8f8f6}
#content hr{border:0;border-top:1px solid var(--line);margin:20px 0}
#content a{color:var(--blue);text-decoration:none}
#content a:hover{text-decoration:underline}
#content code{font-family:var(--mono);font-size:12.5px;background:#f1f1ef;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--txt)}
#content pre{background:#f6f6f4;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;margin:10px 0;color:var(--txt)}
#content pre code{background:transparent;border:0;padding:0}
#content strong,#content b{font-weight:700;color:var(--txt)}
#content em{color:#444}
#content blockquote{margin:10px 0;padding:10px 14px;border-left:3px solid var(--line);background:#f6f6f4;color:#555;border-radius:0 8px 8px 0}
#content img{max-width:100%;border-radius:8px}
#content footer{margin-top:28px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:14px;text-align:center}

@media(max-width:760px){#content .grid,#content .grid2{grid-template-columns:1fr}#content h1{font-size:22px}#content .who{min-width:0}}

/* Safety net: force inherited light text everywhere */
#content, #content div, #content section, #content article, #content span, #content p{color:inherit}
</style></head><body><div class="wrap">
  <div class="topbar">
    <a class="back" href="../../index.html">&larr; SmallTalk</a>
    <h1>Morning Brief</h1>
    <span class="stamp" id="stamp"></span>
  </div>
  <div id="content"><div class="msg">Wczytywanie&hellip;</div></div>
</div><script>(async function(){
  var content = document.getElementById('content');
  var stamp = document.getElementById('stamp');
  try{
    var res = await fetch('./brief.html', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    var text = await res.text();
    var m = text.match(/<!--\s*generated:\s*([^>]*?)\s*-->/i);
    stamp.textContent = m ? m[1] : 'wczytano';
    var doc = new DOMParser().parseFromString(text, 'text/html');
    content.innerHTML = '';
    // Intentionally skip injecting <style> from brief.html (dark theme).
    // The light theme above styles all brief classes.
    var host = document.createElement('div');
    host.innerHTML = doc.body ? doc.body.innerHTML : text;
    // Strip inline styles that would bring the dark theme back.
    host.querySelectorAll('[style]').forEach(function(el){
      ['background','background-color','background-image','color',
       'border-color','border','box-shadow','text-shadow']
        .forEach(function(p){ el.style.removeProperty(p); });
      if(!el.getAttribute('style')) el.removeAttribute('style');
    });
    // Strip legacy attributes that can force dark colors.
    host.querySelectorAll('[bgcolor]').forEach(function(el){ el.removeAttribute('bgcolor'); });
    host.querySelectorAll('font[color]').forEach(function(el){ el.removeAttribute('color'); });
    content.appendChild(host);
  }catch(e){
    content.innerHTML = '<div class="msg">Nie uda\u0142o si\u0119 wczyta\u0107 briefu (' + e.message +
      '). <a href="./brief.html">Otw\u00f3rz brief.html bezpo\u015brednio</a>.</div>';
  }
})();</script></body></html>
